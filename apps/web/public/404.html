<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menutha</title>
    <!-- SPA deep-link support for GitHub Pages: stash the requested path into a
         query string and redirect to index.html, which restores it (HTTP 200).
         rafgraph/spa-github-pages (MIT). pathSegmentsToKeep = 0 for a custom
         domain served at the root (menutha.com). -->
    <script>
      (function (l) {
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
