name: Deploy web to GitHub Pages

# Builds the Menutha customer web-ordering app (Vite) and publishes it to
# GitHub Pages at the custom domain https://menutha.com .
# SPA deep links (/scan/<token>, /track/<id>, /r/<slug>) work via the
# public/404.html + index.html restore snippet (HTTP 200 on deep links).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for i in 1 2 3; do npm ci --no-audit --no-fund && break || { echo "retry $i"; sleep 15; }; done

      - name: Build (vite; skip tsc so a stray type error can't block deploy)
        run: npx vite build

      - name: Verify Pages support files landed in dist
        run: |
          test -f dist/index.html || { echo "no index.html"; exit 1; }
          test -f dist/404.html   || { echo "no 404.html";   exit 1; }
          test -f dist/CNAME      || { echo "no CNAME";       exit 1; }
          echo "CNAME: $(cat dist/CNAME)"
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
